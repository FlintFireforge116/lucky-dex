name: Build Lucky Dex APK

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Lucky Dex source
        run: |
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: Set up Node.js for Classic preflight
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Classic card auditor
        run: node --test source/tests/v07236-classic-card-auditor.test.cjs

      - name: Test completed Secret Wonders card effects and outcomes
        run: node --test source/tests/v07237-secret-wonders-stage1.test.cjs source/tests/v07238-secret-wonders-stage2.test.cjs source/tests/v07239-secret-wonders-stage3.test.cjs source/tests/v07240-secret-wonders-completion.test.cjs source/tests/v07241-secret-wonders-independent-audit.test.cjs

      - name: Check Classic Baby Evolution deck dependencies
        run: node --test source/tests/v07242-classic-baby-evolution-deck-coherence.test.cjs

      - name: Test Great Encounters implementation and card outcomes
        run: node --test source/tests/v07243-great-encounters.test.cjs

      - name: Test Great Encounters continuation and complex card outcomes
        run: node --test source/tests/v07244-great-encounters-stage2.test.cjs source/tests/v07244-great-encounters-remaining.test.cjs

      - name: Test completed Great Encounters complex card outcomes
        run: node --test source/tests/v07245-great-encounters-completion.test.cjs

      - name: Test Great Encounters independent card audit corrections
        run: node --test source/tests/v07246-great-encounters-independent-audit.test.cjs

      - name: Test completed Majestic Dawn implementation, outcomes and CPU set filtering
        run: node --test source/tests/v07247-majestic-dawn-stage1.test.cjs source/tests/v07248-majestic-dawn-continuation.test.cjs

      - name: Audit complete Majestic Dawn effects and CPU-generated decks
        run: node source/scripts/audit-classic-set.cjs --set dp5 --smoke --no-write

      - name: Audit completed Great Encounters battle effects
        run: node source/scripts/audit-classic-set.cjs --set dp4 --smoke --no-write

      - name: Audit completed Mysterious Treasures set
        run: node source/scripts/audit-classic-set.cjs --set dp2 --smoke --no-write

      - name: Audit completed Secret Wonders set
        run: node source/scripts/audit-classic-set.cjs --set dp3 --smoke --no-write

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk LuckyDex-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDex-APK
          path: LuckyDex-debug.apk
          if-no-files-found: error
          retention-days: 30
