name: Build Lucky Dex APK

on:
  push:
    branches: [ main ]
    paths:
      - 'LuckyDex_source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Lucky Dex source
        run: |
          rm -rf source
          mkdir source
          unzip -q LuckyDex_source.zip -d source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk LuckyDex-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDex-APK
          path: LuckyDex-debug.apk
          if-no-files-found: error
          retention-days: 30
