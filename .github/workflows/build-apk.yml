name: Build Lucky Dex APK

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Lucky Dex source
        run: |
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: Set up Node.js for Classic preflight
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Classic card auditor
        run: node --test source/tests/v07236-classic-card-auditor.test.cjs

      - name: Test Secret Wonders staging and effects
        run: node --test source/tests/v07237-secret-wonders-stage1.test.cjs

      - name: Audit completed Mysterious Treasures set
        run: node source/scripts/audit-classic-set.cjs --set dp2 --smoke --no-write

      - name: Audit staged Secret Wonders set
        # Do not claim set-only CPU legality before its remaining cards are enabled.
        run: node source/scripts/audit-classic-set.cjs --set dp3 --smoke --no-cpu --no-write

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk LuckyDex-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDex-APK
          path: LuckyDex-debug.apk
          if-no-files-found: error
          retention-days: 30
